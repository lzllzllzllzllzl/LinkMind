name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # 占位环境变量——避免构建阶段因缺失数据库配置而中断
  # 真实值在 Vercel 项目的 Environment Variables 中配置
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build-and-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run bookmark-store tests
        run: npx tsx tests/bookmark-store.test.ts
        env:
          CI: true

      - name: Run content-extractor tests
        run: npx tsx tests/content-extractor.test.ts
        env:
          CI: true

  health-check:
    runs-on: ubuntu-latest
    needs: build-and-check
    # 仅在 main 分支且配置了 VERCEL_URL secret 时运行
    if: github.ref == 'refs/heads/main' && secrets.VERCEL_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run health check
        run: python3 scripts/health-check.py
        env:
          HEALTH_CHECK_URL: ${{ secrets.VERCEL_URL }}
